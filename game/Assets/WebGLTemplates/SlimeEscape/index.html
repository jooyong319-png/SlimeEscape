<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <!--
      SlimeEscape 웹 틀 (09-16 다듬기 5단계 · 출시 기본기).
      유니티 기본 틀은 게임 아래에 로고·전체화면 띠를 붙여 **게임 아래쪽을 가렸다**.
      여기서는 게임만 둔다: 게임과 같은 어두운 바탕 · 가운데 · 창에 맞춰 16:10 그대로 커진다.
      불러오는 동안은 이름과 흰빛 막대 하나 (초록은 슬라임만 — 색 규칙).
    -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
                   background: #0b0d10; }
      #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { display: block; background: #0b0d10; outline: none; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column;
                 align-items: center; justify-content: center; gap: 18px; pointer-events: none;
                 font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                 transition: opacity .2s ease-out; }
      #loading .name { color: rgba(255,255,255,.92); font-size: 28px; letter-spacing: .02em; }
      #loading .bar  { width: 180px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.10);
                       overflow: hidden; }
      #loading .fill { width: 0%; height: 100%; border-radius: 2px; background: rgba(255,255,255,.62);
                       transition: width .15s linear; }
      #fs { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; padding: 0;
            border-radius: 8px; background: rgba(255,255,255,.06); cursor: pointer; opacity: .35;
            transition: opacity .2s; display: none; }
      #fs:hover { opacity: 1; }
      #fs svg { width: 16px; height: 16px; margin: 7px; }
      #warn { position: absolute; left: 0; right: 0; top: 0; text-align: center;
              font-family: system-ui, sans-serif; font-size: 14px; color: #fff; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
    </div>
    <div id="loading">
      <div class="name">{{{ PRODUCT_NAME }}}</div>
      <div class="bar"><div class="fill"></div></div>
    </div>
    <button id="fs" title="전체 화면" aria-label="전체 화면">
      <svg viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="1.6" stroke-linecap="round">
        <path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4"/>
      </svg>
    </button>
    <div id="warn"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var ASPECT = {{{ WIDTH }}} / {{{ HEIGHT }}};

      //  🔴 창에 맞춰 **비율 그대로** 가장 크게. 폰은 화면 전체를 쓴다 (게임이 알아서 배치한다).
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        if (mobile) { canvas.style.width = w + "px"; canvas.style.height = h + "px"; return; }
        var cw = Math.min(w, h * ASPECT), ch = cw / ASPECT;
        canvas.style.width = Math.floor(cw) + "px";
        canvas.style.height = Math.floor(ch) + "px";
      }
      window.addEventListener("resize", fit);
      fit();

      function unityShowBanner(msg, type) {
        var warn = document.querySelector("#warn");
        var div = document.createElement("div");
        div.textContent = msg;
        div.style.padding = "8px";
        div.style.background = type == "error" ? "#a33" : "rgba(255,255,255,.12)";
        warn.appendChild(div);
        if (type != "error") setTimeout(function () { warn.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      var fill = document.querySelector("#loading .fill");
      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        var loading = document.querySelector("#loading");
        function hideLoading() {
          if (loading.style.opacity === "0") return;
          loading.style.opacity = "0";
          setTimeout(function () { loading.style.display = "none"; }, 250);
        }
        createUnityInstance(canvas, config, function (p) {
          fill.style.width = (100 * p) + "%";
          //  🔴 다 받았으면 **바로** 걷는다 — 기다렸다 걷으면 그 사이 캔버스에 뜨는 시작 화면(유니티 로고)과
          //     이름·막대가 **겹쳐 보였다** (09-16 찍어 봄)
          if (p >= 1) hideLoading();
        }).then(function (unityInstance) {
          hideLoading();
          if (!mobile) {
            var fs = document.querySelector("#fs");
            fs.style.display = "block";
            fs.onclick = function () { unityInstance.SetFullscreen(1); };
          }
          canvas.focus();
        }).catch(function (message) { unityShowBanner(message, "error"); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
